<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --text:#0f172a;--text-2:#334155;--muted:#64748b;--faint:#94a3b8;
        --accent:#2563eb;--accent-dark:#1d4ed8;--accent-ring:rgba(37,99,235,.18);
        --border-strong:#d5dbe6;
      }
      *{box-sizing:border-box}
      body{
        font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
        color:var(--text);margin:0;min-height:100vh;padding:24px;
        display:flex;align-items:center;justify-content:center;
        background:
          radial-gradient(900px 400px at 15% -10%,#dbe7ff 0%,rgba(219,231,255,0) 70%),
          radial-gradient(700px 380px at 100% 110%,#d9f3e5 0%,rgba(217,243,229,0) 70%),
          #f5f7fb;
        -webkit-font-smoothing:antialiased;
      }
      .box{
        background:#fff;width:100%;max-width:400px;padding:32px 32px 28px;border-radius:18px;
        border:1px solid #e5e9f0;
        box-shadow:0 1px 3px rgba(15,23,42,.04),0 24px 60px -20px rgba(15,23,42,.18);
        animation:rise .35s ease;
      }
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .logo{display:block;height:92px;width:auto;margin:0 auto 18px}
      h2{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:center}
      p{color:var(--muted);margin:0 0 24px;font-size:14px;text-align:center}

      .error{
        display:none;align-items:center;gap:8px;margin-bottom:16px;padding:10px 12px;
        background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;font-size:13px;font-weight:500;
      }
      .error.show{display:flex}
      .error svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

      label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:6px}
      .field{position:relative;margin-bottom:16px}
      input{
        width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--border-strong);
        font-family:inherit;font-size:14px;color:var(--text);background:#fff;outline:none;
        transition:border-color .15s,box-shadow .15s;
      }
      input:hover{border-color:#bcc5d4}
      input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
      #password{padding-right:64px}
      .toggle{
        position:absolute;right:6px;bottom:6px;height:30px;padding:0 10px;border:none;border-radius:7px;
        background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;width:auto;
      }
      .toggle:hover{background:#f1f5f9;color:var(--text)}

      button[type=submit]{
        width:100%;height:44px;margin-top:6px;border-radius:10px;border:none;
        background:var(--accent);color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
        box-shadow:0 1px 2px rgba(37,99,235,.3),0 8px 18px -8px rgba(37,99,235,.6);
        transition:background .15s,transform .05s;
      }
      button[type=submit]:hover{background:var(--accent-dark)}
      button[type=submit]:active{transform:translateY(1px)}
      button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-ring)}
      .note{font-size:12px;color:var(--faint);margin-top:18px;text-align:center}
    </style>
  </head>
  <body>
    <form class="box" method="POST" action="/admin/login">
      <img class="logo" src="/logo-full.png" alt="Home Clinic — Health care at your Door Step">
      <h2>Admin Sign in</h2>
      <p>Enter your admin credentials to continue.</p>

      <div id="login-error" class="error" role="alert">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        Invalid username or password
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          autocomplete="off"
          required
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
        />
        <button type="button" class="toggle" id="toggle-pw" aria-label="Show password">Show</button>
      </div>
      <button type="submit">Sign in</button>
      <div class="note">Authorised Homeclinic24 staff only</div>
    </form>

    <script>
      // show the error banner after a failed login (server redirects back with ?error=1)
      if (new URLSearchParams(location.search).get('error')) {
        document.getElementById('login-error').classList.add('show');
        document.getElementById('username').focus();
      }

      document.getElementById('toggle-pw').addEventListener('click', function () {
        const pw = document.getElementById('password');
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        this.textContent = show ? 'Hide' : 'Show';
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    </script>
  </body>
</html>
